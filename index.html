<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#6d28d9" />
  <title>我们的课表 · 蓝粉双色</title>
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="title">我们的课表</div>
    <div class="room">
      <span id="roomId" class="room-id">----</span>
      <button id="shareBtn" class="btn-mini" title="复制房间链接">分享</button>
    </div>
  </header>

  <!-- ① 上传 / 识别 -->
  <section class="card">
    <div class="card-head">
      <span>① 上传我的课表截图</span>
      <button id="editSavedBtn" class="btn-mini">编辑已保存</button>
    </div>
    <div class="role-pick">
      <span class="role-label">这份课表属于：</span>
      <div class="seg">
        <button class="seg-btn blue active" data-role="blue">蓝（我）</button>
        <button class="seg-btn pink" data-role="pink">粉（对象）</button>
      </div>
    </div>
    <div class="date-set">
      <label>本学期第1周周一：
        <input type="date" id="startDateInput" />
      </label>
      <span class="hint-inline">用于把「第N周」换算成真实日期</span>
    </div>
    <div class="upload-row">
      <label class="file-btn">
        <input type="file" id="fileInput" accept="image/*" hidden />
        选择图片
      </label>
      <button id="recognizeBtn" class="btn-primary" disabled>识别课表</button>
    </div>
    <p id="uploadHint" class="hint">支持教务系统 / 超级课表的截图，自动识别课程名、星期、节次、周次、地点。</p>
  </section>

  <!-- ② 识别结果预览（可编辑） -->
  <section class="card" id="previewCard" hidden>
    <div class="card-head">
      <span>② 核对识别结果</span>
      <div class="head-actions">
        <button id="clearAllBtn" class="btn-mini danger">清空全部</button>
        <button id="addRowBtn" class="btn-mini">＋ 加一行</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="edit-table">
        <thead>
          <tr>
            <th class="th-del">删</th>
            <th>课程</th><th>星期</th><th>节起</th><th>节止</th><th>地点</th><th>周起</th><th>周止</th><th>单双</th>
          </tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
    <p class="hint">左侧红色 ✕ 可直接删掉识别错的课；改完点下面「保存并合并」。</p>
    <div class="preview-actions">
      <button id="confirmBtn" class="btn-primary">保存并合并</button>
      <button id="cancelBtn" class="btn-ghost">取消</button>
    </div>
  </section>

  <!-- ③ 合并课表 -->
  <section class="card">
    <div class="card-head">
      <span>③ 合并周课表</span>
      <div class="toggles">
        <label class="tg blue"><input type="checkbox" id="tgBlue" checked /> 蓝</label>
        <label class="tg pink"><input type="checkbox" id="tgPink" checked /> 粉</label>
      </div>
    </div>

    <div class="date-bar">
      <button id="prevWeek" class="btn-icon" title="上一周">‹</button>
      <input type="date" id="viewDate" class="date-input" />
      <button id="nextWeek" class="btn-icon" title="下一周">›</button>
      <button id="todayBtn" class="btn-mini2">本周</button>
      <button id="refreshBtn" class="btn-mini2" title="立即同步">↻</button>
    </div>
    <div class="week-info">
      <span id="rangeText" class="range"></span>
      <span id="badgeBlue" class="badge blue">蓝</span>
      <span id="badgePink" class="badge pink">粉</span>
    </div>

    <div class="grid-wrap">
      <div id="scheduleGrid" class="schedule-grid"></div>
    </div>
    <p class="legend">
      <span class="dot blue"></span>蓝有课
      <span class="dot pink"></span>粉有课
      <span class="dot both"></span>都上课
      <span class="dot free"></span>都空闲
    </p>
    <p class="version">v4 · 可删除/编辑已保存课程</p>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js?v=4"></script>
</body>
</html>
