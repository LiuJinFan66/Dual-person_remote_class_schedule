name = "couple-schedule"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# —— KV 绑定 ——
# 推荐做法：直接在 Cloudflare Pages 控制台绑定，本文件无需改动。
#   Pages 项目 → Settings → Functions → KV namespace bindings → Add：
#   Variable name 填  SCHEDULE_KV ，选中你创建的那个 KV 命名空间。
#
# 若你更想用本文件管理绑定，取消下面 3 行注释，并填入真实的 KV 命名空间 ID
# （32 位十六进制、不带点；在 Cloudflare → KV 页面创建命名空间后可见）：
# [[kv_namespaces]]
# binding = "SCHEDULE_KV"
# id = "你的32位KV命名空间ID"
